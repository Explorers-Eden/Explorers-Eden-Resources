name: Build Resource Pack

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PACK_ZIP_NAME: explorers-eden-resources.zip
  RELEASE_TAG: resource-pack-latest
  RELEASE_TITLE: Latest Resource Pack

# The server picks the new pack up by itself: Nice Control Center checks this release every few minutes and
# writes the new link and SHA-1 into server.properties (Updates tab in the panel), so nothing is uploaded from here.
jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update assets from source repos
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: bash scripts/update-resource-pack-assets.sh

      - name: Commit refreshed assets
        run: bash scripts/commit-refreshed-assets.sh

  build-and-release:
    needs: sync-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build resource pack zip
        run: python scripts/build-resource-pack-zip.py

      - name: Compute SHA1
        id: sha1
        run: python scripts/compute-resource-pack-sha1.py

      - name: Create or update release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-resource-pack-release.sh "${{ github.repository }}"
